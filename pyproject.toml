[tool.poetry]
name = "cisco-ssh-mcp"
version = "1.0.0"
description = "Secure remote MCP server for Cisco routers with optional OIDC authentication and RBAC"
authors = ["Gabor Stenzinger <gabor.stenzinger@gmail.com>"]
readme = "README.md"
packages = [{include = "cisco_ssh_mcp"}]

[tool.poetry.dependencies]
python = "^3.11"
fastmcp = "4.1.6"
paramiko = "5.1.0"
pydantic = "2.14.3"
pydantic-settings = "2.16.2"
python-jose = {extras = ["cryptography"], version = "3.5.0"}
uvicorn = "0.54.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
mcp-server = "cisco_ssh_mcp.server:main"