[tool.poetry]
name = "cisco-ssh-mcp"
version = "1.0.0"
description = "Secure remote MCP server for Cisco routers with Keycloak authentication and RBAC"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "cisco_ssh_mcp"}]

[tool.poetry.dependencies]
python = "^3.11"
fastmcp = "^0.4.0"
paramiko = "^3.4.0"
pydantic-settings = "^2.2.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
uvicorn = "^0.29.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
mcp-server = "cisco_ssh_mcp.server:main"